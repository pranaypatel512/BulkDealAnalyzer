# Pre-commit configuration using prek
# Install prek: https://prek.j178.dev

repos:
  # Secret detection
  - repo: local
    hooks:
      - id: detect-secrets
        name: Detect secrets
        entry: bash -c 'if command -v gitleaks >/dev/null 2>&1; then gitleaks detect --source . --verbose; else echo "gitleaks not installed, skipping"; fi'
        language: system
        pass_filenames: false
        always_run: true

  # Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.0
    hooks:
      - id: ruff
        args: [--fix]
        files: \.py$
      - id: ruff-format
        files: \.py$

  # TypeScript linting
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.0.0
    hooks:
      - id: eslint
        files: \.(ts|tsx|js|jsx)$
        types: [file]
        additional_dependencies:
          - eslint@latest
          - '@typescript-eslint/eslint-plugin@latest'
          - '@typescript-eslint/parser@latest'

  # TypeScript formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(ts|tsx|js|jsx|json|md|css)$


