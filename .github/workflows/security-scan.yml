name: security-scan

on:
  pull_request:
    branches: [ dev, staging, main ]
  push:
    branches: [ dev, staging, main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks
          
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose --redact
          
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          
      - name: Setup Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          
      - name: Run dependency scan (npm)
        continue-on-error: true
        run: |
          if [ -f package.json ]; then
            npm ci
            npm audit --audit-level=high || echo "⚠️ npm audit found vulnerabilities (non-blocking)"
          else
            echo "ℹ️ No package.json found, skipping npm audit"
          fi
          
      - name: Run dependency scan (pip)
        continue-on-error: true
        run: |
          if [ -f backend/requirements.txt ]; then
            python -m pip install safety || echo "⚠️ safety not available, skipping"
            if command -v safety &> /dev/null; then
              safety check --file backend/requirements.txt || echo "⚠️ safety check found issues (non-blocking)"
            fi
          else
            echo "ℹ️ No requirements.txt found, skipping safety check"
          fi
          
      - name: Snyk scan (optional)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "ℹ️ SNYK_TOKEN not configured, skipping Snyk scan"
            exit 0
          fi
          echo "SNYK_TOKEN present — run snyk"
          # Add snyk scan if token is available
          
      - name: Mark dependency scan as successful
        if: always()
        run: |
          echo "✅ Dependency scan completed (warnings are non-blocking)"
          # Always exit successfully - warnings don't block the job
          exit 0

  # Combined security scan job for branch protection
  # This job aggregates secret-scan and dependency-scan results
  security-scan:
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-scan]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Verify security scans passed
        run: |
          echo "Checking required security scan jobs..."
          echo "secret-scan result: ${{ needs.secret-scan.result }}"
          echo "dependency-scan result: ${{ needs.dependency-scan.result }}"
          
          # secret-scan must succeed
          if [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "❌ secret-scan failed or was cancelled"
            exit 1
          fi
          
          # dependency-scan can be skipped (no dependencies), but shouldn't fail
          if [ "${{ needs.dependency-scan.result }}" == "failure" ]; then
            echo "❌ dependency-scan failed"
            exit 1
          fi
          
          echo "✅ All required security scans passed"


