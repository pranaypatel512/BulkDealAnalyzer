name: Security Scan

on:
  pull_request:
    branches: [ dev, staging, main ]
  push:
    branches: [ dev, staging, main ]

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks
          
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose --redact
          
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    # Always run this job, even if there are no dependencies to scan
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          
      - name: Setup Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          
      - name: Run dependency scan (npm)
        continue-on-error: true
        run: |
          if [ -f package.json ]; then
            npm ci
            npm audit --audit-level=high || echo "⚠️ npm audit found vulnerabilities (non-blocking)"
          else
            echo "ℹ️ No package.json found, skipping npm audit"
          fi
          
      - name: Run dependency scan (pip)
        continue-on-error: true
        run: |
          if [ -f backend/requirements.txt ]; then
            python -m pip install safety || echo "⚠️ safety not available, skipping"
            if command -v safety &> /dev/null; then
              safety check --file backend/requirements.txt || echo "⚠️ safety check found issues (non-blocking)"
            fi
          else
            echo "ℹ️ No requirements.txt found, skipping safety check"
          fi
          
      - name: Snyk scan (optional)
        if: ${{ secrets.SNYK_TOKEN != '' }}
        continue-on-error: true
        run: |
          echo "SNYK_TOKEN present — run snyk"
          # Add snyk scan if token is available
          
      - name: Mark dependency scan as successful
        if: always()
        run: |
          echo "✅ Dependency scan completed (warnings are non-blocking)"

  # Combined security scan job for branch protection
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-scan]
    # Allow this job to run even if dependency-scan is skipped (no package.json/requirements.txt)
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Verify security scans passed
        run: |
          echo "Checking required security scan jobs..."
          if [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "❌ secret-scan failed"
            exit 1
          fi
          # dependency-scan can be skipped if no dependencies found, but shouldn't fail
          if [ "${{ needs.dependency-scan.result }}" == "failure" ]; then
            echo "❌ dependency-scan failed"
            exit 1
          fi
          echo "✅ All required security scans passed"


