name: CI Tests

on:
  pull_request:
    branches: [ dev, staging, main ]
  push:
    branches: [ dev, staging, main ]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          
      - name: Install dependencies
        run: |
          if [ -f backend/requirements.txt ]; then python -m pip install -r backend/requirements.txt; fi
          
      - name: Lint with Ruff
        run: |
          if [ -f backend/pyproject.toml ] || [ -f backend/setup.cfg ]; then
            cd backend && ruff check . || exit 1
          else
            echo "No backend linting configuration found"
            exit 0
          fi

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          
      - name: Install dependencies
        run: |
          if [ -f backend/requirements.txt ]; then python -m pip install -r backend/requirements.txt; fi
          
      - name: Run unit tests
        run: |
          if [ -f backend/pytest.ini ] || [ -d backend/tests ]; then
            cd backend && pytest tests/ -v --tb=short || exit 1
          else
            echo "No backend tests found"
            exit 0
          fi

  backend-integration-test:
    name: Backend Integration Tests
    needs: [backend-lint, backend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          
      - name: Install dependencies
        run: |
          if [ -f backend/requirements.txt ]; then python -m pip install -r backend/requirements.txt; fi
          
      - name: Run integration tests
        run: |
          if [ -d backend/tests/integration ]; then
            cd backend && pytest tests/integration -v --tb=short || exit 1
          else
            echo "No integration tests found"
            exit 0
          fi

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    if: false  # Enable when frontend is ready
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci; fi
          
      - name: Lint
        run: |
          if [ -f package.json ]; then npm run lint || exit 1; fi

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    if: false  # Enable when frontend is ready
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci; fi
          
      - name: Run tests
        run: |
          if [ -f package.json ]; then npm test || exit 1; fi

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    if: false  # Enable when frontend is ready
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci; fi
          
      - name: Build
        run: |
          if [ -f package.json ]; then npm run build || exit 1; fi

  # Combined test job for branch protection (until all jobs are ready)
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Verify tests passed
        run: echo "All required tests passed"


